name: APK derle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: APK derle
        run: gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log

      - name: Yayınla
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk DersBekcisi.apk
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" DersBekcisi.apk \
            --repo "${{ github.repository }}" \
            --title "Ders Bekçisi $TAG" \
            --notes "Otomatik derleme. Tabletten indirip kur: DersBekcisi.apk" \
            --latest

      - name: Derleme durumunu kaydet
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/st" && cd "$RUNNER_TEMP/st"
          git init -q
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          echo "run=${{ github.run_number }} sha=${{ github.sha }} sonuc=${{ job.status }}" > status.txt
          if [ -f "$GITHUB_WORKSPACE/build.log" ]; then
            grep -E "^e: |error:|FAILURE|What went wrong|BUILD (SUCCESSFUL|FAILED)|Could not|> " "$GITHUB_WORKSPACE/build.log" | head -n 150 > errors.txt || true
            tail -n 250 "$GITHUB_WORKSPACE/build.log" > build-tail.txt
          fi
          git add -A
          git commit -qm "ci ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ci-status
